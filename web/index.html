<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loft" />
    <title>Loft</title>
  </head>
  <body>
    <script>
      // Applied before first paint: without it a dark-themed install flashes the
      // light room for a frame while React boots.
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-theme",
            (function () {
              var t = localStorage.getItem("loft_theme") || "system";
              if (t === "light" || t === "dark") return t;
              return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            })(),
          );
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
